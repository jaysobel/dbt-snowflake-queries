name: dbt_snowflake_queries
version: 1.0.0
config-version: 2
require-dbt-version: [">=1.10.0", "<3.0.0"]

profile: dbt_snowflake_queries

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  dbt_snowflake_queries:
    account_usage_database: snowflake
    account_usage_schema: account_usage
    query_history_lookback_days: 365
    access_history_lookback_days: 365
    incremental_lookback_days: 3
    include_query_text: true
    tooling_users: []
    included_databases: []
    excluded_databases: []
    included_schemas: []
    excluded_schemas: []
